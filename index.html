<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Weather App</title>
    <!-- Cute Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-wrapper">
        <header class="app-header">
            <span class="app-badge">LIVE FORECAST</span>
            <h1 id="greeting-title">Pastel Weather</h1>
            <p class="subtitle">Real-time weather data powered by Open-Meteo</p>
        </header>

        <!-- Preferences Toggle Button -->
        <div class="settings-toggle-container">
            <button id="settings-toggle-btn" class="secondary-btn" type="button">⚙️ Preferences</button>
        </div>

        <!-- Preferences Box -->
        <section id="settings-box" class="settings-box hidden">
            <h3>USER PREFERENCES</h3>
            <div class="form-group">
                <label for="user-name-input">YOUR NAME</label>
                <input type="text" id="user-name-input" placeholder="Enter name..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>TEMPERATURE COMFORT</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="temp-preference" value="cold">
                        <span>❄️ Cold</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="temp-preference" value="neutral" checked>
                        <span>😊 Neutral</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="temp-preference" value="hot">
                        <span>🔥 Hot</span>
                    </label>
                </div>
            </div>
            <button id="save-settings-btn" type="button">SAVE PREFERENCES</button>
        </section>

        <!-- Search Section -->
        <section class="search-section">
            <form id="search-form" class="search-box" action="javascript:void(0);">
                <input type="text" id="city-input" placeholder="Enter city (e.g. London)..." autocomplete="off" aria-label="City name">
                <button id="search-btn" type="submit">SEARCH</button>
            </form>
        </section>

        <!-- Error Message Banner -->
        <div id="error-message" class="error-message hidden" role="alert"></div>

        <!-- Weather Display Card -->
        <section id="weather-card" class="weather-card">
            <div class="card-header">
                <h2 id="city-name">Loading...</h2>
                <span id="weather-desc" class="weather-desc">--</span>
            </div>

            <div class="card-body">
                <div class="weather-icon" id="weather-emoji" aria-hidden="true">🌤️</div>
                <div class="temp-wrapper">
                    <div class="temp-display">
                        <span id="temperature">--</span><span class="unit">°F</span>
                    </div>
                    <p class="feels-like">Feels like <span id="apparent-temp">--</span>°F</p>
                </div>
            </div>
            <p id="preference-note" class="preference-note"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
