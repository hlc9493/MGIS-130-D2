<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <h1>Pastel Weather</h1>
            <p>Live Weather Forecast</p>
        </header>

        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city (e.g. London)..." autocomplete="off">
            <button id="search-btn" type="button">Search</button>
        </div>

        <div id="weather-card" class="weather-card">
            <h2 id="city-name">Ready</h2>
            <div class="weather-main">
                <span id="weather-emoji" class="emoji">🌤️</span>
                <div class="temp-container">
                    <span id="temperature">--</span>°F
                </div>
            </div>
            <p class="feels">Feels like <span id="apparent-temp">--</span>°F</p>
            <p id="weather-desc" class="desc">Type a city and click Search</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
