<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <h1>🌤️ Pastel Weather</h1>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>
        
        <div id="error-message" class="error-message hidden"></div>

        <div id="weather-card" class="weather-card hidden">
            <div class="weather-icon" id="weather-emoji">☀️</div>
            <h2 id="city-name">--</h2>
            <div class="temp-display">
                <span id="temperature">--</span>°F
            </div>
            <p class="feels-like">Feels like <span id="apparent-temp">--</span>°F</p>
            <p id="weather-desc" class="weather-desc">--</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
