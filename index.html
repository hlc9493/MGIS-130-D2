<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Weather Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fullscreen Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <main class="pokedex-wrapper">
        <header class="pokedex-header">
            <div class="camera-lens"></div>
            <div class="status-lights">
                <span class="light red"></span>
                <span class="light yellow"></span>
                <span class="light green"></span>
            </div>
        </header>

        <div class="title-section">
            <span class="badge">POKÉDEX V2.0</span>
            <h1 id="greeting-title">TRAINER WEATHER</h1>
        </div>

        <div class="settings-toggle-container">
            <button id="settings-toggle-btn" class="pokedex-btn secondary" type="button">⚙️ PROFILE</button>
        </div>

        <section id="settings-box" class="settings-box hidden">
            <h3>TRAINER PROFILE</h3>
            <div class="form-group">
                <label for="user-name-input">TRAINER NAME</label>
                <input type="text" id="user-name-input" placeholder="Ash..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>TEMPERATURE PREFERENCE</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="temp-preference" value="cold">
                        <span>❄️ COLD</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="temp-preference" value="neutral" checked>
                        <span>😊 OK</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="temp-preference" value="hot">
                        <span>🔥 HOT</span>
                    </label>
                </div>
            </div>
            <button id="save-settings-btn" class="pokedex-btn" type="button">SAVE DATA</button>
        </section>

        <section class="search-section">
            <form id="search-form" class="search-box" action="javascript:void(0);">
                <input type="text" id="city-input" placeholder="LOCATION (e.g. London)..." autocomplete="off" aria-label="City name">
                <button id="search-btn" class="pokedex-btn" type="submit">SCAN</button>
            </form>
        </section>

        <div id="error-message" class="error-message hidden" role="alert"></div>

        <section id="weather-card" class="pokedex-screen">
            <div class="scanline"></div>
            <div class="card-header">
                <h2 id="city-name">SCANNING...</h2>
                <span id="weather-desc" class="weather-desc">--</span>
            </div>

            <div class="card-body">
                <div class="pokemon-avatar" id="pokemon-avatar">⚡</div>
                <div class="temp-wrapper">
                    <div class="temp-display">
                        <span id="temperature">--</span><span class="unit">°F</span>
                    </div>
                    <p class="feels-like">FEELS LIKE <span id="apparent-temp">--</span>°F</p>
                </div>
            </div>

            <div class="pokedex-log">
                <p id="preference-note">INITIALIZING SCANNER...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
